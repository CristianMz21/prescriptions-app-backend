name: CI / Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '24'
  PNPM_VERSION: '11.1.1'
  DATABASE_URL: postgresql://cats:cats@localhost:5433/test_db?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: test-jwt-access-secret-000-do-not-use-in-prod
  JWT_REFRESH_SECRET: test-jwt-refresh-secret-000-do-not-use-in-prod
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 7d
  FRONTEND_URL: http://localhost:3000
  NODE_ENV: test
  PORT: 3000
  SEED_DEFAULT_PASSWORD: test-seed-password-000-do-not-use-in-prod

jobs:
  quality-gates:
    name: Install + Format + Lint + Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      - name: Format check
        run: pnpm run format:check
      - name: Lint check
        run: pnpm run lint:check
      - name: TypeScript typecheck
        run: pnpm run typecheck

  build-and-openapi:
    name: Build + OpenAPI Validation
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Build
        run: pnpm run build
      - name: Export OpenAPI
        run: pnpm run export:openapi
      - name: Validate OpenAPI schema
        run: pnpm run validate:openapi
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v7
        with:
          name: openapi-spec
          path: openapi.json

  unit-tests:
    name: Unit Tests + Coverage
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Prepare report directories
        run: mkdir -p reports coverage
      - name: Run unit tests
        run: pnpm exec jest --json --outputFile=reports/unit-test-results.json
      - name: Run coverage
        run: pnpm exec jest --coverage --coverageProvider=v8 --coverageReporters=lcov --coverageReporters=text-summary --coverageReporters=json-summary
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: reports/
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  integration-tests:
    name: Integration Tests
    needs: quality-gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5433:5432']
        env:
          POSTGRES_USER: cats
          POSTGRES_PASSWORD: cats
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U cats -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Install Chrome for Puppeteer
        run: pnpm exec puppeteer browsers install chrome
      - run: pnpm exec prisma migrate deploy
      - run: pnpm run prisma:seed
      - name: Prepare report directories
        run: mkdir -p reports
      - name: Run integration tests
        run: pnpm exec jest --config ./test/jest-e2e.json --testPathPatterns=prescriptions.e2e-spec.ts --json --outputFile=reports/integration-test-results.json
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: reports/integration-test-results.json

  e2e-tests:
    name: E2E Tests
    needs: quality-gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5433:5432']
        env:
          POSTGRES_USER: cats
          POSTGRES_PASSWORD: cats
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U cats -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Install Chrome for Puppeteer
        run: pnpm exec puppeteer browsers install chrome
      - run: pnpm exec prisma migrate deploy
      - run: pnpm run prisma:seed
      - name: Prepare report directories
        run: mkdir -p reports
      - name: Run E2E tests
        run: pnpm exec jest --config ./test/jest-e2e.json --json --outputFile=reports/e2e-test-results.json
      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-reports
          path: reports/e2e-test-results.json
      - name: Upload Playwright report if present
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency Audit
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm audit --audit-level=high

  semgrep:
    name: Semgrep
    needs: quality-gates
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Semgrep
        run: semgrep scan --config=p/security-audit --config=p/typescript --config=p/nodejs --json --output semgrep-report.json .
      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-report
          path: semgrep-report.json

  codeql:
    name: CodeQL
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - run: pnpm run build
      - uses: github/codeql-action/analyze@v4
        with:
          output: codeql-results
      - name: Upload CodeQL report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-results
          path: codeql-results/
          if-no-files-found: ignore

  gitleaks:
    name: Gitleaks
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect \
            --source=/repo --no-git --config=/repo/.gitleaks.toml \
            --report-format json --report-path /repo/gitleaks-report.json --redact \
            --exit-code 1
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json

  cats-fuzz:
    name: CATS API Fuzz
    needs: [build-and-openapi, quality-gates]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5433:5432']
        env:
          POSTGRES_USER: cats
          POSTGRES_PASSWORD: cats
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U cats -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm run prisma:seed
      - run: pnpm run export:openapi
      - name: Start app
        run: pnpm run start:dev > app.log 2>&1 & echo $! > app.pid
      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:${PORT}/ || true)
            if [ "$code" = "200" ] || [ "$code" = "404" ]; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1
      - name: Install CATS (native binary, pinned to 13.8.0)
        run: |
          # The ghcr.io/endava/cats docker image does not publish a stable
          # tag (`:latest`, `:13.8.0` both return `manifest unknown`), so
          # download the native release binary instead. This is also faster
          # and removes the docker-registry dependency entirely.
          set -euo pipefail
          CATS_VERSION="13.8.0"
          curl -sSL -o /tmp/cats.tar.gz \
            "https://github.com/Endava/cats/releases/download/cats-${CATS_VERSION}/cats_linux_amd64_${CATS_VERSION}.tar.gz"
          tar -xzf /tmp/cats.tar.gz -C /tmp
          sudo mv /tmp/cats /usr/local/bin/cats
          cats --version
      - name: Run CATS
        run: |
          mkdir -p cats-report
          # CATS 13.x renamed --report-format and now accepts
          # HTML_ONLY|HTML_JS|HTML_JS_CLUSTERS|JUNIT. HTML_JS provides the
          # interactive HTML report; JUnit is emitted alongside it so CI
          # systems can ingest results.
          cats \
            --contract=openapi.json \
            --server=http://127.0.0.1:${PORT} \
            --headers=cats-headers.yml \
            --reportFormat=HTML_JS \
            --out=cats-report \
          || CATS_EXIT=$?
          # CATS exits non-zero when it finds fuzzing issues (this is the
          # tool's normal "I found something" signal, not a CI failure).
          # Treat any exit other than container/IO errors as success since
          # the report is uploaded as an artifact for human review.
          echo "cats exit code: ${CATS_EXIT:-0}"
          ls -la cats-report || true
      - name: Upload CATS reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cats-report
          path: cats-report/
      - name: Stop app
        if: always()
        run: kill "$(cat app.pid)" || true

  owasp-zap:
    name: OWASP ZAP
    needs: [build-and-openapi, quality-gates]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports: ['5433:5432']
        env:
          POSTGRES_USER: cats
          POSTGRES_PASSWORD: cats
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U cats -d test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      - run: pnpm run prisma:seed
      - run: pnpm run export:openapi
      - name: Start app
        run: pnpm run start:dev > app.log 2>&1 & echo $! > app.pid
      - name: Wait for app
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:${PORT}/ || true)
            if [ "$code" = "200" ] || [ "$code" = "404" ]; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1
      - name: Run ZAP API scan
        run: |
          # ZAP's container has its own `zap` user with a non-standard UID,
          # so we cannot use `--user $(id -u):$(id -g)` (ZAP fails to start).
          # Instead, make the working directory world-writable so the zap
          # user inside the container can write its reports to the bind
          # mount.
          mkdir -p zap-report
          chmod 777 .
          chmod -R 777 zap-report
          ZAP_EXIT=0
          docker run --rm --network host \
            -v "$PWD:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.16.0 \
            zap-api-scan.py \
            -t /zap/wrk/openapi.json \
            -f openapi \
            -r zap-report.html \
            -J zap-report.json \
            -x zap-report.xml \
          || ZAP_EXIT=$?
          mv -f zap-report.html zap-report/ 2>/dev/null || true
          mv -f zap-report.json zap-report/ 2>/dev/null || true
          mv -f zap-report.xml zap-report/ 2>/dev/null || true
          # zap-api-scan exit codes:
          #   0 = no findings
          #   1 = FAIL alerts (real security failures)
          #   2 = WARN-NEW only (informational warnings — passive scan rules)
          #   3 = container/technical error
          # WARN-NEW findings (missing CSP / Permissions-Policy / COEP headers)
          # are tracked separately and do not block CI; only block on 1 or 3.
          echo "zap-api-scan exit code: ${ZAP_EXIT}"
          if [ "${ZAP_EXIT}" = "1" ] || [ "${ZAP_EXIT}" = "3" ]; then
            exit "${ZAP_EXIT}"
          fi
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-zap-report
          path: zap-report/
      - name: Stop app
        if: always()
        run: kill "$(cat app.pid)" || true
