name: Deploy Wiki to GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'openapi.json'
  workflow_dispatch:

# Per-job permissions (Sonar S8264).

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.head_commit.added, ','), 'docs/') ||
      contains(join(github.event.head_commit.modified, ','), 'docs/') ||
      contains(join(github.event.head_commit.removed, ','), 'docs/') ||
      contains(join(github.event.head_commit.added, ','), 'mkdocs.yml') ||
      contains(join(github.event.head_commit.modified, ','), 'mkdocs.yml') ||
      contains(join(github.event.head_commit.removed, ','), 'mkdocs.yml') ||
      contains(join(github.event.head_commit.added, ','), 'openapi.json') ||
      contains(join(github.event.head_commit.modified, ','), 'openapi.json')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pin third-party actions to full commit SHAs (Sonar S7637).
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.12'

      - name: Install MkDocs and Material theme
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Stage live OpenAPI spec for ReDoc
        run: cp openapi.json docs/openapi.json

      - name: Build documentation
        run: mkdocs build --strict --verbose

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
