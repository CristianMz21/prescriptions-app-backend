# Render Blueprint — Prescription Management API
# Docs: https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this file to the repo root of the backend (already at the repo
#      root since the backend IS the repo).
#   2. In Render: Dashboard → New → Blueprint → connect this repo. Render
#      detects render.yaml and creates the resources defined below.
#   3. After the first deploy, copy the Postgres "Internal Database URL"
#      shown in the dashboard and set FRONTEND_URL / APP_ORIGIN to the
#      production frontend URL.

databases:
  - name: prescriptions-db
    databaseName: prescriptions
    user: prescriptions
    plan: free
    postgresMajorVersion: 16
    ipAllowList: [] # internal-only access from the web service

services:
  - type: web
    name: prescriptions-api
    runtime: docker
    plan: starter # free tier crashes Puppeteer (PDF) under load; starter is the floor
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: prescriptions-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render generates a strong random value
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: SEED_DEFAULT_PASSWORD
        sync: false # set manually in the dashboard to avoid leaking in git
      # Set these to the deployed frontend URL after the first deploy.
      - key: FRONTEND_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      # Optional SMTP — leave unset and the API will skip email delivery.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
