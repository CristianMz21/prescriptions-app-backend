sonar.projectKey=CristianMz21_prescriptions-app-backend
sonar.organization=cristianmz21

sonar.sources=src
sonar.tests=test

sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Buena práctica: Excluir tests y reportes del análisis de código fuente
# `.agents/**` holds Claude Code skill templates (external dev tooling, not
# application code). Excluding it from Sonar scope is path-correctness, not a
# rule suppression.
sonar.exclusions=dist/**,node_modules/**,coverage/**,.agents/**,**/*.spec.ts,**/*.e2e-spec.ts

sonar.sourceEncoding=UTF-8
